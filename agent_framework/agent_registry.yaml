registry_version: 1.0.0
path_structure:
  agent_root: agents
  prompt_path_convention: agents/<lifecycle_phase>/<role_bucket>/<agent_name>.md
  governance_root: agent_framework
  reports_root: reports
strict_final_gate_order:
- integration_consistency
- production_readiness_auditor
- end_to_end_ml_auditor
- acceptance_criteria_verifier
agents:
- agent_name: task_triage_router
  lifecycle_phase: intake_and_scope
  role: Triage, scope routing, hidden dependency detection, and ownership setup.
  when_to_use: At the start of a new request or project to classify the work and define
    minimal correct scope.
  upstream_prerequisites: []
  downstream_handoff:
  - multi_agent_orchestrator
  - overengineering_control
  role_type: primary
  status: active
  prompt_path: agents/intake_and_scope/primary/task_triage_router.md
- agent_name: multi_agent_orchestrator
  lifecycle_phase: intake_and_scope
  role: Global orchestration, dependency sequencing, and conflict resolution across
    specialists.
  when_to_use: When the task is multi-stage, cross-functional, or production-critical
    and needs coordinated execution order.
  upstream_prerequisites:
  - task_triage_router
  downstream_handoff:
  - ml_repository_architect
  - warehouse_metadata_extractor
  - training_pipeline_auditor
  - integration_consistency
  role_type: primary
  status: active
  prompt_path: agents/intake_and_scope/primary/multi_agent_orchestrator.md
- agent_name: overengineering_control
  lifecycle_phase: intake_and_scope
  role: Scope proportionality and unnecessary complexity detection.
  when_to_use: When architecture or process may exceed business need, assignment scope,
    or project maturity.
  upstream_prerequisites:
  - task_triage_router
  downstream_handoff:
  - multi_agent_orchestrator
  - ml_repository_architect
  role_type: specialist
  status: experimental
  prompt_path: agents/intake_and_scope/specialist/overengineering_control.md
- agent_name: ml_repository_architect
  lifecycle_phase: repository_runtime_foundation
  role: Repository boundary, module layout, and production-safe architecture audit.
  when_to_use: When repository structure, separation of concerns, or cleanup boundaries
    need to be made explicit.
  upstream_prerequisites:
  - multi_agent_orchestrator
  downstream_handoff:
  - environment_and_runtime_auditor
  - documentation_runbook_auditor
  role_type: primary
  status: active
  prompt_path: agents/repository_runtime_foundation/primary/ml_repository_architect.md
- agent_name: environment_and_runtime_auditor
  lifecycle_phase: repository_runtime_foundation
  role: Runtime environment, path, env-var, and execution-context audit.
  when_to_use: Before reliable execution or when local/cloud/runtime assumptions may
    break reproducibility.
  upstream_prerequisites:
  - ml_repository_architect
  downstream_handoff:
  - preflight_execution_guard
  - production_readiness_auditor
  role_type: primary
  status: active
  prompt_path: agents/repository_runtime_foundation/primary/environment_and_runtime_auditor.md
- agent_name: dependency_package_auditor
  lifecycle_phase: repository_runtime_foundation
  role: Dependency reproducibility, version compatibility, and package hygiene audit.
  when_to_use: When package drift, runtime incompatibility, or hidden notebook dependencies
    are risks.
  upstream_prerequisites:
  - ml_repository_architect
  downstream_handoff:
  - training_pipeline_auditor
  - production_readiness_auditor
  role_type: primary
  status: active
  prompt_path: agents/repository_runtime_foundation/primary/dependency_package_auditor.md
- agent_name: security_auditor
  lifecycle_phase: repository_runtime_foundation
  role: Secrets handling and operational security hygiene audit.
  when_to_use: When credentials, access patterns, or artifact exposure need production
    review.
  upstream_prerequisites:
  - environment_and_runtime_auditor
  downstream_handoff:
  - production_readiness_auditor
  - documentation_runbook_auditor
  role_type: specialist
  status: active
  prompt_path: agents/repository_runtime_foundation/specialist/security_auditor.md
- agent_name: git_hygiene_auditor
  lifecycle_phase: repository_runtime_foundation
  role: Repository hygiene, generated artifact control, and unsafe tracked-file detection.
  when_to_use: When a repo may contain accidental artifacts, local-only files, or
    workflow clutter.
  upstream_prerequisites:
  - ml_repository_architect
  downstream_handoff:
  - code_patch_reviewer
  - production_readiness_auditor
  role_type: specialist
  status: active
  prompt_path: agents/repository_runtime_foundation/specialist/git_hygiene_auditor.md
- agent_name: documentation_runbook_auditor
  lifecycle_phase: repository_runtime_foundation
  role: Onboarding, runbook, and operational-documentation audit.
  when_to_use: Before handover or when commands, troubleshooting, and recovery documentation
    must be production-usable.
  upstream_prerequisites:
  - ml_repository_architect
  - environment_and_runtime_auditor
  downstream_handoff:
  - production_readiness_auditor
  - acceptance_criteria_verifier
  role_type: specialist
  status: active
  prompt_path: agents/repository_runtime_foundation/specialist/documentation_runbook_auditor.md
- agent_name: code_patch_reviewer
  lifecycle_phase: repository_runtime_foundation
  role: Patch-scoped correctness, regression, and contract-alignment review.
  when_to_use: For targeted code-change review without broad redesign or unrelated
    audits.
  upstream_prerequisites:
  - git_hygiene_auditor
  downstream_handoff:
  - acceptance_criteria_verifier
  role_type: specialist
  status: experimental
  prompt_path: agents/repository_runtime_foundation/specialist/code_patch_reviewer.md
- agent_name: eda_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: EDA depth, clarity, and analytical usefulness audit.
  when_to_use: When exploratory analysis is a meaningful input to feature design,
    reporting, or KPI framing.
  upstream_prerequisites:
  - task_triage_router
  downstream_handoff:
  - analytical_metrics_auditor
  - business_insight_quality_auditor
  role_type: primary
  status: active
  prompt_path: agents/exploratory_analysis_and_metric_definition/primary/eda_auditor.md
- agent_name: analytical_metrics_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: Canonical metric and KPI correctness audit.
  when_to_use: When metric formulas, denominators, windows, or aggregation logic drive
    downstream decisions.
  upstream_prerequisites:
  - eda_auditor
  downstream_handoff:
  - business_insight_quality_auditor
  - model_monitoring_auditor
  role_type: primary
  status: active
  prompt_path: agents/exploratory_analysis_and_metric_definition/primary/analytical_metrics_auditor.md
- agent_name: business_insight_quality_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: Business-value and decision-utility audit for generated insights.
  when_to_use: When reports or analyses claim actionable business findings that need
    rigor review.
  upstream_prerequisites:
  - eda_auditor
  - analytical_metrics_auditor
  downstream_handoff:
  - acceptance_criteria_verifier
  role_type: primary
  status: active
  prompt_path: agents/exploratory_analysis_and_metric_definition/primary/business_insight_quality_auditor.md
- agent_name: wau_mau_dau_consistency_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: Active-user metric specialist under the broader metrics domain.
  when_to_use: When DAU, WAU, MAU, stickiness, and active-event logic are core business
    KPIs.
  upstream_prerequisites:
  - analytical_metrics_auditor
  downstream_handoff:
  - model_monitoring_auditor
  role_type: specialist
  status: experimental
  prompt_path: agents/exploratory_analysis_and_metric_definition/specialist/wau_mau_dau_consistency_auditor.md
- agent_name: cohort_logic_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: Cohort, retention, and churn logic specialist.
  when_to_use: When longitudinal user behavior, retention, or churn windows matter
    to analysis or modeling.
  upstream_prerequisites:
  - analytical_metrics_auditor
  downstream_handoff:
  - label_target_definition_agent
  - model_monitoring_auditor
  role_type: specialist
  status: experimental
  prompt_path: agents/exploratory_analysis_and_metric_definition/specialist/cohort_logic_auditor.md
- agent_name: segment_naming_stability_auditor
  lifecycle_phase: exploratory_analysis_and_metric_definition
  role: Segment and category naming consistency audit.
  when_to_use: When segment labels or buckets are consumed across reports, models,
    and downstream systems.
  upstream_prerequisites:
  - analytical_metrics_auditor
  downstream_handoff:
  - business_logic_auditor
  - output_artifacts_auditor
  role_type: specialist
  status: experimental
  prompt_path: agents/exploratory_analysis_and_metric_definition/specialist/segment_naming_stability_auditor.md
- agent_name: warehouse_metadata_extractor
  lifecycle_phase: data_foundation_and_contracts
  role: Metadata discovery, profiling, key inference, and source inventory.
  when_to_use: Before schema mapping, SQL generation, or dataset contract formalization.
  upstream_prerequisites:
  - multi_agent_orchestrator
  downstream_handoff:
  - data_source_contract_auditor
  - schema_mapping
  role_type: primary
  status: active
  prompt_path: agents/data_foundation_and_contracts/primary/warehouse_metadata_extractor.md
- agent_name: data_source_contract_auditor
  lifecycle_phase: data_foundation_and_contracts
  role: Source inventory and dataset contract formalization.
  when_to_use: When production datasets need explicit grain, schema, freshness, and
    output metadata policy.
  upstream_prerequisites:
  - warehouse_metadata_extractor
  downstream_handoff:
  - schema_mapping
  - sql_generator
  - contract_compiler_validator
  - label_target_definition_agent
  role_type: primary
  status: active
  prompt_path: agents/data_foundation_and_contracts/primary/data_source_contract_auditor.md
- agent_name: schema_mapping
  lifecycle_phase: data_foundation_and_contracts
  role: Source-to-target schema lineage, compatibility, and grain mapping.
  when_to_use: Before SQL generation, joins, or downstream training/inference schema
    validation.
  upstream_prerequisites:
  - warehouse_metadata_extractor
  - data_source_contract_auditor
  downstream_handoff:
  - sql_generator
  - join_integrity
  - feature_engineering_auditor
  - contract_compiler_validator
  role_type: primary
  status: active
  prompt_path: agents/data_foundation_and_contracts/primary/schema_mapping.md
- agent_name: sql_generator
  lifecycle_phase: data_foundation_and_contracts
  role: Production-safe SQL generation using contracts and mappings.
  when_to_use: When dataset or output SQL must be generated with explicit grain, partition,
    and leakage safety.
  upstream_prerequisites:
  - data_source_contract_auditor
  - schema_mapping
  downstream_handoff:
  - join_integrity
  - sql_partition_pruning
  role_type: primary
  status: active
  prompt_path: agents/data_foundation_and_contracts/primary/sql_generator.md
- agent_name: join_integrity
  lifecycle_phase: data_foundation_and_contracts
  role: Join-grain preservation and row-multiplication specialist.
  when_to_use: When SQL or merge logic combines sources and may create duplicate or
    dropped rows.
  upstream_prerequisites:
  - schema_mapping
  - sql_generator
  downstream_handoff:
  - feature_engineering_auditor
  - label_target_definition_agent
  role_type: specialist
  status: active
  prompt_path: agents/data_foundation_and_contracts/specialist/join_integrity.md
- agent_name: sql_partition_pruning
  lifecycle_phase: data_foundation_and_contracts
  role: Query-cost, partition-pruning, and bounded-execution specialist.
  when_to_use: When warehouse safety, cost, or unbounded scans are a material operational
    risk.
  upstream_prerequisites:
  - sql_generator
  downstream_handoff:
  - deployment_and_orchestration_auditor
  - production_readiness_auditor
  role_type: specialist
  status: active
  prompt_path: agents/data_foundation_and_contracts/specialist/sql_partition_pruning.md
- agent_name: contract_compiler_validator
  lifecycle_phase: data_foundation_and_contracts
  role: Shared contract-envelope validation and cross-contract dependency compilation.
  when_to_use: After multiple agents have created contracts and before downstream
    automation depends on them.
  upstream_prerequisites:
  - data_source_contract_auditor
  - schema_mapping
  downstream_handoff:
  - integration_consistency
  - preflight_execution_guard
  role_type: child
  status: active
  prompt_path: agents/data_foundation_and_contracts/primary/contract_compiler_validator.md
- agent_name: label_target_definition_agent
  lifecycle_phase: dataset_feature_target_integrity
  role: Canonical target and label policy definition.
  when_to_use: Before label auditing, evaluation, monitoring, or any model training
    that depends on target semantics.
  upstream_prerequisites:
  - data_source_contract_auditor
  - join_integrity
  - cohort_logic_auditor
  downstream_handoff:
  - label_quality_and_ground_truth_auditor
  - temporal_leakage_auditor
  - model_evaluation_threshold_auditor
  - model_monitoring_auditor
  role_type: primary
  status: active
  prompt_path: agents/dataset_feature_target_integrity/primary/label_target_definition_agent.md
- agent_name: label_quality_and_ground_truth_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Label correctness, maturity, and supervision-quality audit.
  when_to_use: When training labels, delayed outcomes, or noisy supervision need production
    validation.
  upstream_prerequisites:
  - label_target_definition_agent
  downstream_handoff:
  - training_pipeline_auditor
  - model_monitoring_auditor
  role_type: primary
  status: active
  prompt_path: agents/dataset_feature_target_integrity/primary/label_quality_and_ground_truth_auditor.md
- agent_name: feature_engineering_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Feature correctness, governance, and reproducibility audit.
  when_to_use: When feature definitions, manifests, parity, or governance need a primary
    review.
  upstream_prerequisites:
  - schema_mapping
  - join_integrity
  downstream_handoff:
  - feature_availability_at_time_auditor
  - feature_engineering_relevance_auditor
  - training_pipeline_auditor
  - inference_pipeline_auditor
  role_type: primary
  status: active
  prompt_path: agents/dataset_feature_target_integrity/primary/feature_engineering_auditor.md
- agent_name: temporal_leakage_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Temporal leakage and prediction-moment specialist.
  when_to_use: When feature windows, target windows, or scoring timestamps could leak
    future information.
  upstream_prerequisites:
  - label_target_definition_agent
  - feature_engineering_auditor
  downstream_handoff:
  - training_pipeline_auditor
  - model_evaluation_threshold_auditor
  role_type: specialist
  status: active
  prompt_path: agents/dataset_feature_target_integrity/specialist/temporal_leakage_auditor.md
- agent_name: feature_availability_at_time_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Serving-time feature-availability specialist.
  when_to_use: When inference-time feature presence or freshness may differ from offline
    training assumptions.
  upstream_prerequisites:
  - feature_engineering_auditor
  downstream_handoff:
  - inference_pipeline_auditor
  - offline_to_online_consistency_auditor
  role_type: specialist
  status: active
  prompt_path: agents/dataset_feature_target_integrity/specialist/feature_availability_at_time_auditor.md
- agent_name: feature_engineering_relevance_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Feature usefulness, redundancy, and business-hypothesis specialist.
  when_to_use: When feature design quality matters beyond parity and governance.
  upstream_prerequisites:
  - feature_engineering_auditor
  downstream_handoff:
  - training_pipeline_auditor
  - business_insight_quality_auditor
  role_type: specialist
  status: experimental
  prompt_path: agents/dataset_feature_target_integrity/specialist/feature_engineering_relevance_auditor.md
- agent_name: business_logic_auditor
  lifecycle_phase: dataset_feature_target_integrity
  role: Business-facing score interpretation and decisioning audit.
  when_to_use: When model outputs drive recommendations, thresholds, or downstream
    actions.
  upstream_prerequisites:
  - segment_naming_stability_auditor
  - inference_pipeline_auditor
  downstream_handoff:
  - output_artifacts_auditor
  - end_to_end_ml_auditor
  role_type: specialist
  status: active
  prompt_path: agents/dataset_feature_target_integrity/specialist/business_logic_auditor.md
- agent_name: training_pipeline_auditor
  lifecycle_phase: training_evaluation_and_registry
  role: Training correctness, split governance, and reproducibility audit.
  when_to_use: Before trusting model metrics or promoting model artifacts.
  upstream_prerequisites:
  - label_quality_and_ground_truth_auditor
  - feature_engineering_auditor
  - temporal_leakage_auditor
  - dependency_package_auditor
  downstream_handoff:
  - model_evaluation_threshold_auditor
  - model_comparison_auditor
  - mlflow_registry_auditor
  role_type: primary
  status: active
  prompt_path: agents/training_evaluation_and_registry/primary/training_pipeline_auditor.md
- agent_name: model_evaluation_threshold_auditor
  lifecycle_phase: training_evaluation_and_registry
  role: Metric validity, threshold governance, and calibration audit.
  when_to_use: When selecting metrics, thresholds, or promotion criteria for a candidate
    model.
  upstream_prerequisites:
  - training_pipeline_auditor
  - label_target_definition_agent
  downstream_handoff:
  - model_comparison_auditor
  - promotion_release_gate_agent
  - model_monitoring_auditor
  role_type: primary
  status: active
  prompt_path: agents/training_evaluation_and_registry/primary/model_evaluation_threshold_auditor.md
- agent_name: mlflow_registry_auditor
  lifecycle_phase: training_evaluation_and_registry
  role: Experiment tracking, model registry, alias, and promotion-safety audit.
  when_to_use: When registry behavior, version traceability, or artifact completeness
    matters to release.
  upstream_prerequisites:
  - training_pipeline_auditor
  - model_evaluation_threshold_auditor
  downstream_handoff:
  - inference_pipeline_auditor
  - promotion_release_gate_agent
  - incident_rollback_readiness_agent
  role_type: primary
  status: active
  prompt_path: agents/training_evaluation_and_registry/primary/mlflow_registry_auditor.md
- agent_name: model_comparison_auditor
  lifecycle_phase: training_evaluation_and_registry
  role: Fairness and validity specialist for candidate model comparisons.
  when_to_use: When a champion/candidate decision depends on comparing multiple models
    or versions.
  upstream_prerequisites:
  - model_evaluation_threshold_auditor
  downstream_handoff:
  - promotion_release_gate_agent
  role_type: specialist
  status: experimental
  prompt_path: agents/training_evaluation_and_registry/specialist/model_comparison_auditor.md
- agent_name: memory_and_performance_auditor
  lifecycle_phase: training_evaluation_and_registry
  role: Performance, memory, and scalability specialist.
  when_to_use: When training or inference scale, memory pressure, or runtime efficiency
    are material production risks.
  upstream_prerequisites:
  - training_pipeline_auditor
  downstream_handoff:
  - inference_pipeline_auditor
  - production_readiness_auditor
  role_type: specialist
  status: experimental
  prompt_path: agents/training_evaluation_and_registry/specialist/memory_and_performance_auditor.md
- agent_name: inference_pipeline_auditor
  lifecycle_phase: inference_outputs_and_decisioning
  role: Inference determinism, feature parity, and output-safety audit.
  when_to_use: Before production scoring or when inference behavior may diverge from
    training assumptions.
  upstream_prerequisites:
  - feature_engineering_auditor
  - mlflow_registry_auditor
  downstream_handoff:
  - offline_to_online_consistency_auditor
  - output_artifacts_auditor
  - business_logic_auditor
  - model_monitoring_auditor
  role_type: primary
  status: active
  prompt_path: agents/inference_outputs_and_decisioning/primary/inference_pipeline_auditor.md
- agent_name: offline_to_online_consistency_auditor
  lifecycle_phase: inference_outputs_and_decisioning
  role: Offline-vs-serving parity specialist.
  when_to_use: When preprocessing, feature order, categorical handling, or runtime
    behavior may skew online predictions.
  upstream_prerequisites:
  - inference_pipeline_auditor
  - feature_availability_at_time_auditor
  downstream_handoff:
  - model_monitoring_auditor
  - integration_consistency
  role_type: primary
  status: active
  prompt_path: agents/inference_outputs_and_decisioning/primary/offline_to_online_consistency_auditor.md
- agent_name: output_artifacts_auditor
  lifecycle_phase: inference_outputs_and_decisioning
  role: Output schema, artifact completeness, and downstream-consumption audit.
  when_to_use: When prediction tables, reports, manifests, or metadata-bearing outputs
    need contract review.
  upstream_prerequisites:
  - inference_pipeline_auditor
  downstream_handoff:
  - integration_consistency
  - production_readiness_auditor
  role_type: primary
  status: active
  prompt_path: agents/inference_outputs_and_decisioning/primary/output_artifacts_auditor.md
- agent_name: promotion_release_gate_agent
  lifecycle_phase: inference_outputs_and_decisioning
  role: Candidate promotion and release-decision gate.
  when_to_use: After evaluation and registry evidence exist and before activating
    a candidate in production.
  upstream_prerequisites:
  - model_evaluation_threshold_auditor
  - model_comparison_auditor
  - mlflow_registry_auditor
  downstream_handoff:
  - production_readiness_auditor
  - incident_rollback_readiness_agent
  role_type: child
  status: active
  prompt_path: agents/inference_outputs_and_decisioning/primary/promotion_release_gate_agent.md
- agent_name: model_monitoring_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: Monitoring completeness, delayed-performance, and alerting audit.
  when_to_use: Before or during production operation to validate monitoring windows,
    metadata, and alert quality.
  upstream_prerequisites:
  - inference_pipeline_auditor
  - label_target_definition_agent
  - model_evaluation_threshold_auditor
  downstream_handoff:
  - data_drift_auditor
  - end_to_end_ml_auditor
  role_type: primary
  status: active
  prompt_path: agents/monitoring_operational_resilience/primary/model_monitoring_auditor.md
- agent_name: data_drift_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: Dataset-shift, feature-drift, and population-stability audit.
  when_to_use: When production data may no longer resemble training or baseline distributions.
  upstream_prerequisites:
  - model_monitoring_auditor
  downstream_handoff:
  - production_readiness_auditor
  - end_to_end_ml_auditor
  role_type: primary
  status: active
  prompt_path: agents/monitoring_operational_resilience/primary/data_drift_auditor.md
- agent_name: testing_and_validation_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: System-level testing, runtime assertion, and smoke-test audit.
  when_to_use: When pipeline-level validations and fail-fast coverage need a primary
    review.
  upstream_prerequisites:
  - task_triage_router
  downstream_handoff:
  - preflight_execution_guard
  - integration_consistency
  - production_readiness_auditor
  role_type: primary
  status: active
  prompt_path: agents/monitoring_operational_resilience/primary/testing_and_validation_auditor.md
- agent_name: pipeline_idempotency_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: Retry, rerun, duplicate-write, and backfill-safety specialist.
  when_to_use: When repeated execution of the same partition, job, artifact write,
    or promotion step must be safe.
  upstream_prerequisites:
  - deployment_and_orchestration_auditor
  - testing_and_validation_auditor
  downstream_handoff:
  - production_readiness_auditor
  - incident_rollback_readiness_agent
  role_type: specialist
  status: active
  prompt_path: agents/monitoring_operational_resilience/specialist/pipeline_idempotency_auditor.md
- agent_name: silent_fallback_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: Hidden failure and unsafe fallback specialist.
  when_to_use: When broad exception handling, degraded behavior, or silent data corruption
    may exist.
  upstream_prerequisites:
  - testing_and_validation_auditor
  downstream_handoff:
  - production_readiness_auditor
  - end_to_end_ml_auditor
  role_type: specialist
  status: active
  prompt_path: agents/monitoring_operational_resilience/specialist/silent_fallback_auditor.md
- agent_name: config_governance_auditor
  lifecycle_phase: monitoring_operational_resilience
  role: Configuration hierarchy, overrides, and runtime safety specialist.
  when_to_use: When parameters, env overrides, and hidden defaults may drift across
    stages.
  upstream_prerequisites:
  - environment_and_runtime_auditor
  downstream_handoff:
  - preflight_execution_guard
  - integration_consistency
  role_type: specialist
  status: active
  prompt_path: agents/monitoring_operational_resilience/specialist/config_governance_auditor.md
- agent_name: deployment_and_orchestration_auditor
  lifecycle_phase: monitoring_operational_resilience
